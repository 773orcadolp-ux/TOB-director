name: TOB予兆 日次スキャン

on:
  workflow_dispatch:
    inputs:
      scan_date:
        description: '対象日 (YYYY-MM-DD, 空欄なら本日)'
        required: false
        default: ''
  schedule:
    - cron: "0 1 * * 1-5"
    - cron: "0 3 * * 1-5"
    - cron: "0 6 * * 1-5"
    - cron: "0 10 * * 1-5"

jobs:
  scan:
    name: EDINET スキャン
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve scan date
        id: resolve_date
        run: |
          if [ -z "${{ github.event.inputs.scan_date }}" ]; then
            echo "date=$(TZ=Asia/Tokyo date +%Y-%m-%d)" >> $GITHUB_OUTPUT
          else
            echo "date=${{ github.event.inputs.scan_date }}" >> $GITHUB_OUTPUT
          fi

      - name: Run holding delay scan
        env:
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SCAN_DATE: ${{ steps.resolve_date.outputs.date }}
        run: |
          python -m detector.tob_detector --date $SCAN_DATE \
            --output results/tob_alerts_${SCAN_DATE}
        continue-on-error: true

      - name: Run correction lag scan
        env:
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
          SLACK_WEBHOOK_CORRECTION: ${{ secrets.SLACK_WEBHOOK_CORRECTION }}
          SCAN_DATE: ${{ steps.resolve_date.outputs.date }}
        run: |
          python -m detector.correction_lag --date $SCAN_DATE \
            --output results/correction_alerts_${SCAN_DATE}
        continue-on-error: true

      - name: Run SPC monitor
        env:
          NTA_API_KEY: ${{ secrets.NTA_API_KEY }}
          SLACK_WEBHOOK_BOX: ${{ secrets.SLACK_WEBHOOK_BOX }}
          SCAN_DATE: ${{ steps.resolve_date.outputs.date }}
        run: |
          python -m detector.spc_monitor --days 1 \
            --output results/spc_alerts_${SCAN_DATE}
        continue-on-error: true

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tob-scan-results-${{ steps.resolve_date.outputs.date }}
          path: results/
          if-no-files-found: ignore
